services:
  backend:
    image: python:3.11-slim
    container_name: waste-backend
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: sqlite:///./waste_detection.db
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: "true"
      RELOAD: "true"
      GOONG_MAPS_ENABLED: "true"
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    container_name: waste-frontend
    working_dir: /app
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

